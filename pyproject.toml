[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arquitarea"
version = "0.1.0"
description = "Demo de sistemas aislados con integracion batch por SQLite"
requires-python = ">=3.14"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[tool.setuptools]
py-modules = ["build_exes", "main", "rrhh_desktop", "ventas_desktop"]

[tool.setuptools.packages.find]
include = ["sistema_ventas", "sistema_rrhh", "integracion"]
